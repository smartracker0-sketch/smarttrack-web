name: Web security regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --ignore-scripts
      - run: node --test tests/*.test.mjs
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src
      - name: Production build without runtime secrets
        env:
          TRACKPRO_API_BASE_URL: http://127.0.0.1:8080
          SMARTTRACKER_ALLOWED_ORIGINS: https://smarttracker.cloud,https://www.smarttracker.cloud
        run: npm run build
